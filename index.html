<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE4">
<meta name="apple-mobile-web-app-title" content="Kuki">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<title>Kuki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F6EFE4;--card:#FFFFFF;--ink:#1F2433;--muted:#6B6458;--line:#E6DCCB;--en:#1F5FBF;--en-s:#E5EEFB;--nl:#E2701F;--nl-s:#FDEBDD;--star:#FFC93C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1A16;--card:#2A251F;--ink:#F3EDE4;--muted:#B5AA99;--line:#3B342C;--en-s:#20304A;--nl-s:#3D2A1C}}
:root[data-theme="dark"]{--bg:#1E1A16;--card:#2A251F;--ink:#F3EDE4;--muted:#B5AA99;--line:#3B342C;--en-s:#20304A;--nl-s:#3D2A1C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:230px;height:250px;margin-top:6px}
.stage svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 16px rgba(80,50,20,.18))}
.kuki{cursor:pointer;-webkit-tap-highlight-color:transparent;animation:drop 1.1s cubic-bezier(.3,1.5,.5,1) both;transform-origin:50% 95%}
.kuki .m-eyes{transform-origin:60px 46px;animation:blink 3.6s 1.4s infinite}
.kuki .m-arm-r{transform-origin:80px 95px;animation:wave 2.6s 1s ease-in-out infinite}
.kuki .k-head{transform-origin:60px 72px;animation:curious 5s 4.5s ease-in-out infinite}
.kuki .k-star,.kuki .k-q{opacity:0}
.kuki .k-tongue{opacity:0;transition:opacity .2s}
.kuki.jump{animation:jump .7s cubic-bezier(.3,.7,.4,1)}
.kuki.jump .k-tongue{opacity:1}
.kuki.starry .k-star{opacity:1;transform-origin:91px 13px;animation:starpop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{0%{transform:translateY(-120px) scale(.7);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,70%,100%{transform:rotate(0)}8%{transform:rotate(28deg)}17%{transform:rotate(-12deg)}26%{transform:rotate(28deg)}35%{transform:rotate(-12deg)}44%{transform:rotate(28deg)}55%{transform:rotate(0)}}
@keyframes curious{0%,80%,100%{transform:none}86%{transform:rotate(-9deg)}93%{transform:rotate(6deg)}}
@keyframes jump{0%{transform:none}18%{transform:scale(1.08,.88)}45%{transform:translateY(-34px) scale(.94,1.06)}72%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35) rotate(12deg)}100%{transform:none}}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:46px 38px 52px 34px / 40px 50px 34px 48px;padding:18px 24px 16px;text-align:center;max-width:350px;margin:0 0 22px;opacity:0;animation:pop .45s .9s cubic-bezier(.3,1.5,.5,1) both;box-shadow:5px 6px 0 var(--ink);transform:rotate(-1.5deg)}
.bubble:before,.bubble:after{content:'';position:absolute;left:44%;width:0;height:0;border-style:solid}
.bubble:before{bottom:-27px;border-width:26px 4px 0 24px;border-color:var(--ink) transparent transparent transparent;filter:drop-shadow(4px 3px 0 var(--ink))}
.bubble:after{bottom:-19px;left:calc(44% + 3.5px);border-width:20px 2px 0 18px;border-color:var(--card) transparent transparent transparent}
.bubble .spark{position:absolute;font-size:1.3rem;animation:twinkle 2.4s ease-in-out infinite}
.bubble .s1{top:-14px;left:-8px}.bubble .s2{top:-10px;right:-6px;animation-delay:1.2s;font-size:1rem}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(25deg);opacity:.55}}
.bubble h1{font-family:Fredoka,sans-serif;font-size:2rem;line-height:1.1;margin:0}
.bubble p{margin:6px 0 0;font-weight:700;font-size:1.08rem}
.bubble .say{display:inline-block;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:.88rem;font-weight:700;color:#8A5A00;background:#FFF1C9;border-radius:999px;padding:3px 12px;margin-top:9px;min-height:1.3em}
.tap{position:absolute;left:-60px;top:168px;background:#E2701F;color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:1rem;padding:6px 12px;border-radius:999px;box-shadow:0 4px 0 #A94F12;white-space:nowrap;pointer-events:none;opacity:0;animation:fade .4s 2s both,nudge 1s 2.4s ease-in-out infinite;z-index:2}
.tap.gone{animation:none;opacity:0;transition:opacity .3s}
@keyframes nudge{0%,100%{transform:translateX(0) rotate(-5deg)}50%{transform:translateX(9px) rotate(-5deg)}}
@keyframes pop{0%{transform:scale(.6) translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.name{font-family:Fredoka,sans-serif;font-weight:600;color:var(--muted);margin:2px 0 16px;font-size:.95rem;opacity:0;animation:fade .5s 1.3s both}
@keyframes fade{to{opacity:1}}
.choices{display:grid;gap:14px;width:100%;opacity:0;animation:up .5s 1.4s ease-out both}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;font:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.choice .flag{font-size:2.4rem;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.choice.en .flag{background:var(--en-s)} .choice.nl .flag{background:var(--nl-s)}
.choice .t{flex:1;min-width:0}
.choice b{display:block;font-family:Fredoka,sans-serif;font-size:1.35rem;font-weight:600}
.choice.en b{color:var(--en)} .choice.nl b{color:var(--nl)}
.choice span.s{display:block;color:var(--muted);font-weight:700;font-size:.95rem}
.choice .p{display:block;font-size:.85rem;font-weight:800;margin-top:4px}
.choice .go{font-size:1.4rem;color:var(--muted)}
.foot{margin-top:18px;color:var(--muted);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion: reduce){*:not(.m-arm-r){animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bubble" role="status"><span class="spark s1">✨</span><span class="spark s2">✨</span><h1>Selamat datang, Rei!</h1><p>Let's learn Dutch &amp; English together. 😏</p><div class="say" id="say">Halo, aku Kuki! 🐾</div></div>
  <div class="stage"><div class="tap" id="tap">Ketuk aku! 👉</div><div class="kuki" id="kuki" role="button" tabindex="0" aria-label="Kuki"><svg viewBox="0 0 120 130" aria-hidden="true" class="kuki-svg">
  <path class="k-branch" d="M4 121 Q60 112 116 122" stroke="#8A6A3B" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path class="k-branch" d="M96 119 q8 -10 18 -10" stroke="#8A6A3B" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse class="k-branch" cx="114" cy="106" rx="6" ry="3.5" fill="#7FB069" transform="rotate(-25 114 106)"/>
  <g class="m-arm-l"><ellipse cx="36" cy="97" rx="8.5" ry="15" fill="#C49A70" transform="rotate(22 36 97)"/><ellipse cx="41" cy="111" rx="7" ry="5" fill="#EBCFAE"/></g>
  <ellipse cx="60" cy="97" rx="27" ry="25" fill="#C49A70"/>
  <path d="M60 72 C57 82 57 92 60 104 C63 92 63 82 60 72Z" fill="#9A6F48" opacity=".55"/>
  <ellipse cx="60" cy="103" rx="16.5" ry="16" fill="#F4E4CE"/>
  <ellipse cx="46" cy="119" rx="9" ry="5.5" fill="#B0845A"/><ellipse cx="74" cy="119" rx="9" ry="5.5" fill="#B0845A"/>
  <g class="m-arm-r"><ellipse cx="86" cy="85" rx="8" ry="15" fill="#C49A70" transform="rotate(-38 86 85)"/><circle cx="94" cy="73" r="6.2" fill="#EBCFAE"/></g>
  <circle cx="30" cy="31" r="9.5" fill="#B0845A"/><circle cx="30" cy="31" r="5" fill="#E9B9A2"/>
  <circle cx="90" cy="31" r="9.5" fill="#B0845A"/><circle cx="90" cy="31" r="5" fill="#E9B9A2"/>
  <g class="k-head">
    <ellipse cx="60" cy="47" rx="32" ry="29" fill="#D9B48A"/>
    <path d="M60 18 C55 23 54 29 56.5 35 L63.5 35 C66 29 65 23 60 18Z" fill="#74492C"/>
    <ellipse cx="45" cy="45" rx="13.5" ry="14.5" fill="#6A4128" transform="rotate(-16 45 45)"/>
    <ellipse cx="75" cy="45" rx="13.5" ry="14.5" fill="#6A4128" transform="rotate(16 75 45)"/>
    <path d="M57 31 L63 31 L65.5 57 Q60 62 54.5 57Z" fill="#FFF7EA"/>
    <ellipse cx="60" cy="61" rx="13" ry="9" fill="#FFF7EA"/>
    <g class="m-eyes"><circle cx="45" cy="46" r="9.3" fill="#1D1209"/><circle cx="75" cy="46" r="9.3" fill="#1D1209"/>
      <g class="k-shine"><circle cx="48.2" cy="42.4" r="3.6" fill="#fff"/><circle cx="78.2" cy="42.4" r="3.6" fill="#fff"/><circle cx="42.4" cy="49.6" r="1.5" fill="#fff"/><circle cx="72.4" cy="49.6" r="1.5" fill="#fff"/></g></g>
    <ellipse cx="60" cy="57.5" rx="4.2" ry="3" fill="#8E4B4B"/>
    <path class="k-mouth" d="M54.5 62.5 Q60 67 65.5 62.5" stroke="#5A3A24" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="k-tongue" d="M58 64.5 Q60 69.5 62 64.5Z" fill="#E86F7A"/>
    <ellipse cx="37" cy="61" rx="5.5" ry="3.2" fill="#F2A39C" opacity=".75"/><ellipse cx="83" cy="61" rx="5.5" ry="3.2" fill="#F2A39C" opacity=".75"/>
  </g>
  <g class="k-star"><path d="M91 3 l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6L91 20.4l-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z" fill="#FFC93C" stroke="#C98A00" stroke-width="1.6" stroke-linejoin="round"/></g>
  <g class="k-q"><text x="100" y="40" font-size="24" font-weight="800" fill="#2F6FA8" font-family="Fredoka, Nunito, sans-serif">?</text></g>
</svg></div></div>
  <div class="name">Kuki · si kukang 🌿</div>
  <div class="choices">
    <a class="choice en" id="go-en" href="english-v1.html"><span class="flag">🇬🇧</span><span class="t"><b>English</b><span class="s">Belajar bahasa Inggris</span><span class="p" id="p-en"></span></span><span class="go">›</span></a>
    <a class="choice nl" id="go-nl" href="dutch-v1.html"><span class="flag">🇳🇱</span><span class="t"><b>Nederlands</b><span class="s">Belajar bahasa Belanda</span><span class="p" id="p-nl"></span></span><span class="go">›</span></a>
  </div>
</div>
<script>
const REPO = 'rudy104e/Kuki-for-Rei-';
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
function get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function streak(days){ const s = new Set(days); let t = today(); if (!s.has(t)) t--; let n = 0; while (s.has(t)){ n++; t--; } return n; }
let anyToday = false;
[['en', 'kuki-en-'], ['nl', 'kuki-nl-']].forEach(([k, p]) => {
  const days = get(p + 'days', []), done = Object.keys(get(p + 'course', {})).length, st = streak(days);
  if (days.includes(today())) anyToday = true;
  const el = document.getElementById('p-' + k);
  el.textContent = done || st ? `⭐ ${st} hari berturut-turut · ${done} langkah selesai` : 'Mulai dari awal ✨';
});
const kuki = document.getElementById('kuki'), say = document.getElementById('say');
if (anyToday) setTimeout(() => kuki.classList.add('starry'), 1500);
const LINES = ['Halo, aku Kuki! 🐾', 'Hihi, geli! 😆', 'Ayo belajar bareng! 📚', 'Kuki penasaran… hari ini belajar apa?', 'Psst… Kuki suka pisang 🍌', 'Pelan-pelan saja, aku juga kukang 🐢', 'Kamu pasti bisa! 💪', 'Mau bahasa Inggris atau Belanda? 🤔'];
let li = 0;
const tap = document.getElementById('tap');
function poke(){
  tap.classList.add('gone');
  kuki.classList.remove('jump'); void kuki.offsetWidth; kuki.classList.add('jump');
  li = (li + 1 + Math.floor(Math.random() * (LINES.length - 1))) % LINES.length; say.textContent = LINES[li];
}
kuki.addEventListener('click', poke);
kuki.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); poke(); } });
// nieuwste versie van elke app zoeken (english-vN.html / dutch-vN.html)
(async function(){
  try{
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3000);
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/', {signal: ctl.signal, cache: 'no-store'});
    if (!r.ok) return;
    const names = (await r.json()).map(f => f.name);
    [['english', 'go-en'], ['dutch', 'go-nl']].forEach(([b, id]) => {
      const re = new RegExp('^' + b + '-v(\\d+)\\.html$');
      const v = names.map(n => { const m = n.match(re); return m ? [+m[1], n] : null; }).filter(Boolean).sort((a, c) => c[0] - a[0])[0];
      if (v) document.getElementById(id).href = v[1];
    });
  }catch(e){}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
